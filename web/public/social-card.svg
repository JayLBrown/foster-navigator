<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Foster Parent Navigator — a plain-language answer, with the rule underneath">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b5e"/>
      <stop offset="1" stop-color="#0a2f4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- skyline: kept below the type so nothing reads through a headline -->
  <g fill="#ffffff" opacity="0.07">
    <rect x="40" y="548" width="78" height="82"/>
    <rect x="140" y="504" width="58" height="126"/>
    <rect x="222" y="566" width="94" height="64"/>
    <rect x="340" y="522" width="62" height="108"/>
    <rect x="820" y="498" width="74" height="132"/>
    <rect x="916" y="452" width="98" height="178"/>
    <rect x="1036" y="512" width="74" height="118"/>
    <circle cx="965" cy="440" r="26"/>
  </g>

  <!-- mark -->
  <g transform="translate(88 82)">
    <circle cx="36" cy="36" r="36" fill="#ffffff"/>
    <circle cx="36" cy="36" r="22" fill="none" stroke="#0d3b5e" stroke-width="4.6"/>
    <path d="M46.8 25.2l-6.6 15-15 6.6 6.6-15z" fill="#e8863c"/>
  </g>
  <text x="180" y="112" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Foster Parent</text>
  <text x="180" y="150" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#8fc4e4">Navigator</text>

  <text x="88" y="286" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">A foster parent shouldn&#8217;t need</text>
  <text x="88" y="360" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">a lawyer to read the rules.</text>

  <text x="88" y="424" font-family="'Source Sans 3', Helvetica, Arial, sans-serif" font-size="30" fill="#b6d2e6">A plain-language answer, with the exact Michigan rule quoted underneath.</text>

  <rect x="88" y="474" width="196" height="54" rx="27" fill="#e8863c"/>
  <text x="186" y="509" text-anchor="middle" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">43 rules</text>

  <text x="308" y="509" font-family="'Source Sans 3', Helvetica, Arial, sans-serif" font-size="24" fill="#8fc4e4">every licensed Michigan foster home is held to</text>
</svg>
